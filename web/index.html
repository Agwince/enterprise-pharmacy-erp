<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Enterprise Pharmacy ERP - Multi-Branch Management System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Disable Cache for Mobile Browser Reliability -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Allow camera/media access without CSP blocking -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pharmacy ERP">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310B981'/%3E%3Cpath d='M35 20h30v20h20v30h-20v20h-30v-20h-20v-30h20z' fill='white'/%3E%3C/svg%3E">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310B981'/%3E%3Cpath d='M35 20h30v20h20v30h-20v20h-30v-20h-20v-30h20z' fill='white'/%3E%3C/svg%3E"/>

  <title>Enterprise Pharmacy ERP</title>
  <link rel="manifest" href="manifest.json">

  <!-- Barcode / QR Scanner Web Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/@nicestudios/zxing-wasm@1.2.15/dist/full/zxing_reader.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

  <!-- Service Worker Cache Purge & Fast HTML Engine Config -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    window.flutterWebRenderer = "html";
    window.flutterConfiguration = {
      renderer: "html"
    };
  </script>
</head>
<body>
  <!-- Task 3: Force HTML Engine & Cache Busting v=final_prod -->
  <script>
    window.addEventListener('load', function(ev) {
      // FORCE NUKE CORRUPT SUPABASE SESSION
      localStorage.clear();
      
      // NUKE SERVICE WORKER TO FORCE FRESH JAVASCRIPT
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: null,
          onEntrypointLoaded: async function(engineInitializer) {
            let appRunner = await engineInitializer.initializeEngine({
              renderer: "html",
              useColorEmoji: true,
            });
            await appRunner.runApp();
          }
        });
      }
    });
  </script>
  <script src="main.dart.js?v=9999999999" defer></script>
</body>
</html>
