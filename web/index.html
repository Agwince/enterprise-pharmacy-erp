<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Enterprise Pharmacy ERP - Multi-Branch Management System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Disable Cache for Mobile Browser Reliability -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Allow camera/media access without CSP blocking -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pharmacy ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Enterprise Pharmacy ERP</title>
  <link rel="manifest" href="manifest.json">

  <!-- Barcode / QR Scanner Web Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/@nicestudios/zxing-wasm@1.2.15/dist/full/zxing_reader.min.js" crossorigin="anonymous"></script>

  <!-- Task 2: Service Worker Cache Purge for Mobile Browsers -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    window.flutterWebRenderer = "html";
    window.flutterConfiguration = {
      renderer: "html"
    };
  </script>
</head>
<body>
  <!-- Task 1: Nuclear HTML Renderer Initialization -->
  <script>
    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.load({
          serviceWorkerSettings: null,
          config: {
            renderer: "html",
            useColorEmoji: true,
          }
        });
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
